# ===== notification-service (Juan José Cuellar) =====
spring.application.name=notification-service
server.port=8084

# ----- Base de datos propia de este microservicio -----
# El usuario y la clave NO se escriben aqui: se leen de variables de entorno.
spring.datasource.url=jdbc:mysql://localhost:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ----- JPA: Hibernate SOLO valida, nunca crea ni modifica tablas -----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ----- Flyway: crea las tablas con los scripts de src/main/resources/db/migration -----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ----- Swagger -----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ----- Actuator -----
management.endpoints.web.exposure.include=health,info

# ----- CORS: origins of the web client (distrilink-web with Live Server) -----
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500
